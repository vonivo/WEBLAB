<div class="mb-12">
  <h1 class="text-4xl font-bold">{{ 'types.team.title' | translate }}</h1>
</div>

<div class="grid grid-cols-12 gap-8">
  <div class="col-span-12 md:col-span-8">
    <app-team-list></app-team-list>

    <div class="md:invisible flex justify-end">
      <button matFab (click)="openCreateTeamDialog()">
        <mat-icon>add</mat-icon>
      </button>
    </div>
  </div>

  <div class="invisible md:visible col-span-4">
    <app-add-team (onFormSubmit)="handleTeamCreate($event)"></app-add-team>
  </div>
</div>
