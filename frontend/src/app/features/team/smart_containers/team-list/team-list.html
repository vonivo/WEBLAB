@if (teamsResource.value()) {
  @for (team of teamsResource.value(); track team.name) {
    <div class="mb-4">
      <app-team-list-entry
        [team]="team"
        (onTeamDeleted)="handleTeamDeleted($event)"
      ></app-team-list-entry>
    </div>
  }
} @else if (teamsResource.isLoading()) {
  @for (i of [0, 1, 2, 3]; track i) {
    <div class="h-18 mb-4">
      <app-skeleton-loader></app-skeleton-loader>
    </div>
  }
} @else if (teamsResource.error()) {
  error
}
