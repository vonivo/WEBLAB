<div class="flex items-center justify-center">
  <div class="w-full max-w-md rounded-2xl border border-gray-200 bg-white p-8 shadow-lg">

    <div class="mb-8 text-center">
      <h1 class="text-3xl font-semibold">
        {{ 'navigation.login' | translate }}
      </h1>
    </div>

    <form class="space-y-5">
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>{{ 'generic.username' | translate }}</mat-label>
        <input
          matInput
          [placeholder]="'generic.username' | translate"
        >
      </mat-form-field>
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>{{ 'generic.password' | translate }}</mat-label>
        <input
          matInput
          type="password"
          [placeholder]="'generic.password' | translate"
        >
      </mat-form-field>

      <button
        type="submit"
        matButton="filled"
        class="h-12 w-full rounded-lg"
      >
        {{ 'generic.submit' | translate }}
      </button>

    </form>
  </div>
</div>
