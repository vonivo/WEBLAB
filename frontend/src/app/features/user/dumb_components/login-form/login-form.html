<div class="flex items-center justify-center">
  <div class="w-full max-w-md rounded-2xl border border-gray-200 bg-white p-8 shadow-lg">
    <div class="mb-8 text-center">
      <h1 class="text-3xl font-semibold">
        {{ 'navigation.login' | translate }}
      </h1>
    </div>

    <form class="space-y-5">
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>{{ 'generic.username' | translate }}</mat-label>
        <input
          matInput
          [placeholder]="'generic.username' | translate"
          [formField]="loginForm.username"
          data-testid="LF_USERNAME_INPUT"
        />
        <mat-error>
          @for (error of loginForm.username().errors(); track error) {
            <span>{{ error.message | translate }}</span>
          }
        </mat-error>
      </mat-form-field>

      <button
        type="submit"
        matButton="filled"
        class="h-12 w-full rounded-lg"
        (click)="handleLoginClick($event)"
        data-testid="LF_LOGIN_BTN"
      >
        {{ 'generic.login' | translate }}
      </button>
      <button
        type="submit"
        matButton="outlined"
        class="h-12 w-full rounded-lg"
        (click)="handleRegistrationClick($event)"
        data-testid="LF_REGISTER_BTN"
      >
        {{ 'generic.register' | translate }}
      </button>
    </form>
  </div>
</div>
