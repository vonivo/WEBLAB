<div class="flex flex-col md:flex-row justify-around">
  @for (team of teams(); track team.team) {
    <div class="p-5 sm:p-6">
      <div class="flex items-center gap-3">
        <span
          class="flex h-10 w-10 shrink-0 items-center justify-center overflow-hidden rounded-full"
        >
          @if (team.logoUrl) {
            <img
              [src]="team.logoUrl"
              [alt]="team.name + ' logo'"
              class="h-full w-full object-contain p-1"
            />
          }
        </span>
        <h2 class="text-lg font-bold">{{ team.name }}</h2>
      </div>

      @if (team.players.length > 0) {
        <ol class="mt-4 divide-y divide-(--lt-border)">
          @for (player of team.players; track player._id; let i = $index) {
            <li class="flex items-baseline gap-3 py-2 text-sm">
              <span class="font-medium text-(--lt-text)">
                {{ player.firstname }} {{ player.lastname }}
              </span>
            </li>
          }
        </ol>
      } @else {
        <p class="mt-4 text-sm text-(--lt-muted)">No lineup set yet.</p>
      }
    </div>
  }
</div>
