<div class="mb-6">
  <a [routerLink]="`/games/${game()._id}`">
    <article class="mx-auto overflow-hidden rounded-2xl border-outline-variant shadow-sm px-6 py-6">
      <div class="flex justify-between">
        <div class="flex items-center sm:gap-8">
          <div class="h-12 w-12 sm:h-24 sm:w-24 rounded-xl">
            <img
              [src]="game().homeTeam.logoUrl"
              [alt]="game().homeTeam.name + ' logo'"
              class="h-full w-full object-contain"
            />
          </div>
          <div>
            <h2 class="text-md sm:text-2xl font-semibold">{{ game().homeTeam.name }}</h2>
          </div>
        </div>

        <div class="flex flex-col justify-center items-center">
          <div
            class="flex items-center justify-center gap-2 text-xs font-semibold tracking-wide justify-self-start"
          >
            @if (isLive()) {
              <span
                class="relative flex h-2 w-2"
                [attr.data-testid]="`GLE_${game()._id}_LIVE_INDICATOR`"
              >
                <span
                  class="absolute inline-flex h-full w-full animate-ping rounded-full bg-(--lt-accent) opacity-75"
                ></span>
                <span class="relative inline-flex h-2 w-2 rounded-full bg-(--lt-accent)"></span>
              </span>
            }
            <span [ngClass]="'live' === 'live' ? 'text-(--lt-accent)' : 'text-(--lt-muted)'">
              {{ statusLabel() }}
            </span>
          </div>

          <div class="flex items-center text-md sm:text-2xl font-bold">
            @if (isUpcoming()) {
              <span>- : -</span>
            } @else {
              <span>{{ homeScore() }} : {{ awayScore() }}</span>
            }
          </div>

          <span>
            {{ game().startDate | date }}
          </span>
        </div>
        <div class="flex items-center sm:gap-8">
          <div>
            <h2 class="text-md sm:text-2xl font-semibold">{{ game().awayTeam.name }}</h2>
          </div>
          <div class="h-12 w-12 sm:h-24 sm:w-24 rounded-xl">
            <img
              [src]="game().awayTeam.logoUrl"
              [alt]="game().awayTeam.name + ' logo'"
              class="h-full w-full object-contain"
            />
          </div>
        </div>
      </div>
    </article>
  </a>
</div>
