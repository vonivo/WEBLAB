<mat-toolbar class="!px-0 sticky top-0 z-50 shadow-sm">
  <div class="w-full md:max-w-3xl lg:max-w-5xl xl:max-w-7xl mx-auto px-4 md:px-8 flex items-center">

    <a routerLink="/home" class="flex items-center gap-2 shrink-0 no-underline">
      <span class="text-base font-semibold tracking-tight text-inherit">Live Ticker</span>
    </a>

    <span class="flex-1"></span>

    <!-- Desktop links -->
    <nav class="hidden md:flex items-center gap-1">
      @for (linkItem of navigationLinks(); track linkItem.path) {

        <a [routerLink]="linkItem.path"
          routerLinkActive="!text-primary !font-semibold"
          [routerLinkActiveOptions]="{ exact: linkItem.path === '/' }"
          mat-button
          class="text-sm! min-w-0! px-3!"
          >
        {{ linkItem.label | translate }}
        </a>
      }
    </nav>

    <!-- Mobile menu trigger -->
    <button
      mat-icon-button
      class="md:hidden!"
      [matMenuTriggerFor]="mobileMenu"
      aria-label="Open navigation menu"
    >
      <mat-icon>menu</mat-icon>
    </button>

    <mat-menu #mobileMenu="matMenu" xPosition="before">
      @for (linkItem of navigationLinks(); track linkItem.path) {

        <a mat-menu-item
          [routerLink]="linkItem.path"
          routerLinkActive="!text-primary !font-semibold"
          [routerLinkActiveOptions]="{ exact: linkItem.path === '/' }"
          >
        {{ linkItem.label | translate }}
        </a>
      }
    </mat-menu>

  </div>
</mat-toolbar>
