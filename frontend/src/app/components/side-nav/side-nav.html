<nav class="flex flex-col gap-1 p-3">
  @for (linkItem of navigationLinks(); track linkItem.path) {
    <a
      mat-button
      (click)="linkItemClicked.emit(linkItem)"
      [routerLink]="linkItem.path"
      routerLinkActive="bg-primary/10! text-primary! font-semibold!"
      [routerLinkActiveOptions]="{ exact: linkItem.path === '/' }"
      class="w-full! justify-start! px-3!"
    >
      {{ linkItem.label | translate }}
    </a>
  }
</nav>
