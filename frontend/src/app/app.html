<app-navigation
  (burgerMenuClicked)="drawer.toggle()"
  [navigationSideNavOpen]="navigationSideNavOpen()"
  [navigationLinks]="getAvailableLinks()"
></app-navigation>

<mat-drawer-container autosize>
  <mat-drawer #drawer (openedChange)="navigationSideNavOpen.set($event)"></mat-drawer>
  <main
    class="w-full md:max-w-3xl lg:max-w-5xl xl:max-w-7xl mx-auto px-4 md:px-8 py-6 md:py-10 min-h-[calc(100vh-4rem)]"
  >
    <router-outlet />
  </main>
</mat-drawer-container>
